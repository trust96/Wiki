# Compatibility shim. Prefer the root compose file from the monorepo root:
#   yarn docker:dev
#   yarn docker:prod
#
#   docker compose --profile dev -f docker-compose.yml up --build
#   docker compose --profile prod -f docker-compose.yml up --build

services:
  frontend-dev:
    extends:
      file: ../docker-compose.yml
      service: frontend-dev
  backend-dev:
    extends:
      file: ../docker-compose.yml
      service: backend-dev
  frontend-prod:
    extends:
      file: ../docker-compose.yml
      service: frontend-prod
  backend-prod:
    extends:
      file: ../docker-compose.yml
      service: backend-prod
  postgres:
    extends:
      file: ../docker-compose.yml
      service: postgres
  redis:
    extends:
      file: ../docker-compose.yml
      service: redis
