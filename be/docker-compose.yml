services:
  # Compatibility shim. Prefer running the root compose file:
  #   docker compose --profile dev -f docker-compose.yml up --build
  #   docker compose --profile prod -f docker-compose.yml up --build
  frontend-dev:
    extends:
      file: ../docker-compose.yml
      service: frontend-dev
  backend-dev:
    extends:
      file: ../docker-compose.yml
      service: backend-dev
  frontend-prod:
    extends:
      file: ../docker-compose.yml
      service: frontend-prod
  backend-prod:
    extends:
      file: ../docker-compose.yml
      service: backend-prod
  postgres:
    extends:
      file: ../docker-compose.yml
      service: postgres
  redis:
    extends:
      file: ../docker-compose.yml
      service: redis
